name: yazen
description: A high-performance local-first media player for audio and video.
publish_to: "none"
version: 0.1.3+12

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Playback and background controls.
  just_audio: ^0.10.6
  video_thumbnail: ^0.5.3
  video_player: ^2.9.2
  audio_service: ^0.18.19
  audio_session: ^0.2.2

  # Local media library.
  on_audio_query: ^2.9.0

  # Lightweight reactive state propagation.
  provider: ^6.1.5+1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  package_info_plus: ^10.2.2
  http: ^1.5.0

  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Local forks keep the legacy plugins compatible with the project's Android Gradle Plugin.
dependency_overrides:
  on_audio_query_android:
    path: third_party/on_audio_query_android
  video_thumbnail:
    path: third_party/video_thumbnail

flutter:
  uses-material-design: true

  assets:
    - assets/yazen_app_icon_master.png

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 200
          style: normal
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 300
          style: normal
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 500
          style: normal
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 800
          style: normal
